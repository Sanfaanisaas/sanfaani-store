name: frontend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - run: pnpm lighthouse
      - run: pnpm security:scan
      - run: pnpm mobile:validate
      - run: pnpm mobile:type-check
      - run: pnpm mobile:test
      - run: pnpm smoke:api
        env:
          API_SMOKE_URL: ${{ secrets.API_SMOKE_URL }}
      - run: pnpm smoke:vercel
        env:
          VERCEL_SMOKE_URL: ${{ secrets.VERCEL_SMOKE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: |
            test-results/
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
